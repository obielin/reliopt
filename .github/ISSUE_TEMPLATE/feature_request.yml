name: Feature Request
description: Propose a new feature for reliopt
title: "Feat: "
labels: ["enhancement"]
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Checked other resources
      options:
        - label: This is a feature request, not a bug report or usage question.
          required: true
        - label: I added a clear and descriptive title that summarizes the feature request.
          required: true
        - label: I used the GitHub search to find a similar feature request and didn't find one.
          required: true
        - label: I checked README.md and ARCHITECTURE.md to see if this feature already exists or is already planned.
          required: true
  - type: textarea
    id: description
    attributes:
      label: Feature description
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: What problem does this solve for you? Why doesn't the current behavior work?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered 