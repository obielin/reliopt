[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reliopt"
version = "0.1.0"
description = "Reliability-constrained, multi-objective optimization for LLM and agent programs."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Linda Oraegbunam" }
]
keywords = ["llm", "agents", "reliability", "evaluation", "dspy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/obielin/reliopt"
Repository = "https://github.com/obielin/reliopt"
Issues = "https://github.com/obielin/reliopt/issues"

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff==0.16.5", "mypy>=1.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/reliopt"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "RUF", "B"]
