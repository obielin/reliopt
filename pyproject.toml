[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reliopt"
version = "0.1.0"
description = "Reliability-constrained, multi-objective optimization for LLM and agent programs."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Linda Oraegbunam" }
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff==0.16.5", "mypy>=1.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/reliopt"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "RUF", "B"]
